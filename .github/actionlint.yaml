self-hosted-runner:
  # GitHub-hosted, but newer than actionlint's label list: https://github.com/actions/runner-images#available-images
  labels:
    - xcode-27

paths:
  .github/workflows/**/*.yml:
    ignore:
      # GitHub supports `concurrency.queue`, but actionlint doesn't know it yet: https://github.com/rhysd/actionlint/issues/654
      - 'unexpected key "queue" for "concurrency" section'
