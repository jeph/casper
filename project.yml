name: Casper
options:
  developmentLanguage: en
  bundleIdPrefix: io.jeph
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift
    exactVersion: 0.0.28
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
    # Casper only uses FluidAudio's speech recognition, which doesn't need the prebuilt NeMo text-normalization
    # library that the default NemoTextProcessing trait links.
    traits: []
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.6
  # speech-swift requires this exact version.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.4
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Casper:
    type: application
    platform: macOS
    sources:
      - Casper
    scheme:
      testTargets:
        - CasperTests
    dependencies:
      - package: SpeechSwift
        product: Qwen3ASR
      - package: SpeechSwift
        product: AudioCommon
      - package: FluidAudio
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - package: Sparkle
    info:
      path: Casper/Info.plist
      properties:
        CFBundleDisplayName: Casper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Jeph. MIT License.
        NSMicrophoneUsageDescription: Casper records your voice to transcribe it on this Mac. Audio never leaves your device.
        # Sparkle checks the latest release's appcast once a day. Unless the user turns it off in Settings > General, it
        # downloads the update it finds and installs it when Casper quits, and the impatient interval matching the check
        # interval brings up the update alert again each day until it's installed or skipped. Local builds, numbered 0,
        # don't check at all; see AppUpdater.
        SUFeedURL: https://github.com/jeph/casper/releases/latest/download/appcast.xml
        SUPublicEDKey: GtGQUn4MSX94Go6DNixIKnR+uGQqCPyU1+MnEW9OhAg=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUScheduledImpatientCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: true
        SUShowReleaseNotes: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    entitlements:
      path: Casper/Casper.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jeph.Casper
        # Local builds are 0.0.0 (0). Release CI sets both to the workflow run number; see `make archive`.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        # Ad hoc unless `make` finds a signing certificate; see LOCAL_SIGNING_IDENTITY in the Makefile. It stays
        # separate from CODE_SIGN_IDENTITY so a command-line value reaches only this target, not the package targets,
        # which can't be signed with a certificate.
        LOCAL_SIGNING_IDENTITY: "-"
        CODE_SIGN_IDENTITY: $(LOCAL_SIGNING_IDENTITY)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # FluidAudio bundles LuxTTS's English pronunciation data, derived from GPL-3.0 espeak-ng output and CC-BY-SA word
    # lists. Only LuxTTS text-to-speech reads it, which Casper never runs, so it's left out of the app. The files are
    # outputs so the script sandbox lets the step delete them.
    postBuildScripts:
      - name: Remove LuxTTS Data
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/FluidAudio_FluidAudio.bundle/Contents/Resources/luxtts_en_us_lexicon.tsv.zz
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/FluidAudio_FluidAudio.bundle/Contents/Resources/luxtts_en_us_g2p_aux.json
        script: rm -f "$SCRIPT_OUTPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_1"
  # Tests compile the app sources they cover instead of loading the app, so running them doesn't start dictation.
  CasperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CasperTests
      - Casper/Audio/SilenceTrimmer.swift
      - Casper/Dictation/DictationMode.swift
      - Casper/Dictation/LiveRefinement.swift
      - Casper/Dictation/LiveSegmenter.swift
      - Casper/Dictation/SegmentAudio.swift
      - Casper/Dictionary/CorrectionFinder.swift
      - Casper/Dictionary/DictionaryCorrection.swift
      - Casper/Dictionary/DictionaryStore.swift
      - Casper/Dictionary/DictionaryWord.swift
      - Casper/Dictionary/ReplayCheck.swift
      - Casper/History/HistoryDatabase.swift
      - Casper/History/HistorySearch.swift
      - Casper/History/HistoryStats.swift
      - Casper/Models/DownloadableModel.swift
      - Casper/Models/ModelDownloader.swift
      - Casper/Models/ModelStore.swift
      - Casper/Refine/CasualStyle.swift
      - Casper/Refine/PersonaPromptCache.swift
      - Casper/Refine/PersonaStore.swift
      - Casper/Refine/RefinePersona.swift
      - Casper/Refine/RefinePrompt.swift
      - Casper/Refine/TranscriptLookup.swift
      - Casper/Transcription/CtcScoring.swift
      - Casper/Transcription/SpokenWord.swift
      - Casper/VoiceBubble/FullScreenVideo.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jeph.CasperTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
